<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IBVAP – Intelligent Border Video Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{height:100%;margin:0;background:#020617;color:#e2e8f0;font-family:system-ui,sans-serif}
#map{height:100%;width:100%;background:#0f172a}
.leaflet-container{background:#0f172a}
.sev-low{background:rgba(14,165,233,.15);color:#7dd3fc}
.sev-medium{background:rgba(245,158,11,.15);color:#fcd34d}
.sev-high{background:rgba(249,115,22,.15);color:#fdba74}
.sev-critical{background:rgba(239,68,68,.15);color:#fca5a5}
@keyframes pulse{50%{opacity:.55}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
</style>
</head>
<body class="h-full flex flex-col">
<header class="flex flex-wrap items-center gap-3 border-b border-slate-800 px-4 py-3">
  <div>
    <div class="text-sm font-bold text-white">IBVAP</div>
    <div class="text-[11px] text-slate-400">Intelligent Border Video Analytics · SSB Force Multiplier</div>
  </div>
  <div class="ml-auto flex gap-2 items-center">
    <span id="liveBadge" class="rounded-full border border-slate-700 px-2.5 py-1 text-xs text-slate-400">● Offline</span>
    <button id="btnTrigger" class="rounded-lg bg-cyan-600 hover:bg-cyan-500 px-3 py-1.5 text-xs font-semibold text-white">Simulate Detection</button>
  </div>
</header>
<div id="stats" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-2 border-b border-slate-800 px-4 py-3"></div>
<main class="grid min-h-0 flex-1 grid-cols-1 lg:grid-cols-12">
  <section class="relative min-h-[280px] border-r border-slate-800 p-3 lg:col-span-7 xl:col-span-8">
    <div class="h-full overflow-hidden rounded-xl border border-slate-800"><div id="map"></div></div>
  </section>
  <section class="flex min-h-0 flex-col lg:col-span-5 xl:col-span-4">
    <div class="min-h-0 flex-1 border-b border-slate-800 flex flex-col" style="max-height:55%">
      <div class="flex justify-between border-b border-slate-800 px-4 py-3">
        <h2 class="text-sm font-semibold">Live Alerts</h2>
        <span id="openCount" class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-400">0 open</span>
      </div>
      <div id="alertList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </div>
    <div class="min-h-0 flex-1 flex flex-col">
      <div class="flex justify-between border-b border-slate-800 px-4 py-3">
        <h2 class="text-sm font-semibold">Tamper-Evident Log</h2>
        <span id="chainBadge" class="rounded-full bg-emerald-500/15 text-emerald-300 px-2 py-0.5 text-xs">Chain OK</span>
      </div>
      <div id="auditList" class="flex-1 overflow-y-auto p-3 font-mono text-[11px] space-y-2"></div>
    </div>
  </section>
</main>
<footer class="border-t border-slate-800 px-4 py-2 text-[11px] text-slate-500">AI assists · Humans decide · Nation secured · Privacy-by-design</footer>
<script>
const API='/api',SEV={low:'#38bdf8',medium:'#fbbf24',high:'#f97316',critical:'#ef4444'};
const TYPE={virtual_fence:'Virtual Fence',loitering:'Loitering',direction:'Direction',repeated_crossing:'Repeated Cross',zone_dwell:'Zone Dwell',multi_camera:'Multi-Cam'};
let map,alertMarkers={},selectedId=null,alerts=[],cameras=[],bops=[],fences=[];
function initMap(){map=L.map('map').setView([27.2,87.5],7);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(map)}
function renderStats(s){if(!s)return;const items=[['Open Alerts',s.open_alerts,'text-orange-300'],['Cameras',s.cameras_online+'/'+s.cameras_total,'text-emerald-300'],['BOPs',s.bops_covered,'text-sky-300'],['Response',s.avg_response_min+' min','text-violet-300'],['False Alarm',s.false_alarm_rate+'%','text-amber-300'],['Audit',s.audit_chain_valid?'Valid':'Broken',s.audit_chain_valid?'text-emerald-300':'text-red-300']];
document.getElementById('stats').innerHTML=items.map(i=>'<div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2.5"><div class="text-[11px] uppercase text-slate-500">'+i[0]+'</div><div class="text-sm font-semibold '+i[2]+'">'+i[1]+'</div></div>').join('')}
function renderAlerts(){const open=alerts.filter(a=>a.status==='open').length;document.getElementById('openCount').textContent=open+' open';
const el=document.getElementById('alertList');if(!alerts.length){el.innerHTML='<p class="text-center text-sm text-slate-500 py-8">Waiting for detections…</p>';return}
el.innerHTML=alerts.map(a=>{const sel=selectedId===a.id;const pulse=a.status==='open'&&a.severity==='critical'?'pulse':'';
let actions='';if(a.status==='open'&&sel){actions='<div class="flex gap-2 pt-1"><button onclick="review(\''+a.id+'\',\'approve\')" class="flex-1 rounded-lg bg-emerald-600/20 px-2 py-1.5 text-xs text-emerald-300">Verify</button><button onclick="review(\''+a.id+'\',\'discard\')" class="flex-1 rounded-lg bg-slate-700/40 px-2 py-1.5 text-xs">Discard</button><button onclick="review(\''+a.id+'\',\'escalate\')" class="flex-1 rounded-lg bg-orange-600/20 px-2 py-1.5 text-xs text-orange-300">Escalate</button></div>'}
else if(a.status!=='open'){actions='<div class="text-[11px] text-slate-500">Status: '+a.status+'</div>'}
return '<button onclick="selectAlert(\''+a.id+'\')" class="w-full text-left rounded-xl border p-3 '+(sel?'border-cyan-500/50 bg-slate-800/80':'border-slate-800 bg-slate-900/60')+' '+pulse+'"><div class="flex justify-between gap-2 mb-1"><span class="text-sm font-medium">'+a.title+'</span><span class="rounded-md px-1.5 py-0.5 text-[10px] uppercase sev-'+a.severity+'">'+a.severity+'</span></div><p class="text-xs text-slate-400 mb-2">'+a.description+'</p><div class="flex flex-wrap gap-2 text-[11px] text-slate-500"><span class="rounded bg-slate-800 px-1.5">'+((TYPE[a.type])||a.type)+'</span><span>Score '+Math.round(a.score*100)+'%</span><span class="ml-auto">'+new Date(a.timestamp).toLocaleTimeString()+'</span></div>'+actions+'</button>'}).join('')}
function renderAudit(entries,valid){const b=document.getElementById('chainBadge');b.textContent=valid?'Chain OK':'Broken';b.className='rounded-full px-2 py-0.5 text-xs '+(valid?'bg-emerald-500/15 text-emerald-300':'bg-red-500/15 text-red-300');
document.getElementById('auditList').innerHTML=(entries||[]).map(e=>'<div class="rounded-lg border border-slate-800 bg-slate-900/50 p-2.5"><div class="flex justify-between mb-1"><span class="text-violet-300">#'+e.id+' · '+e.event_type+'</span><span class="text-slate-500">'+new Date(e.timestamp).toLocaleTimeString()+'</span></div><div class="truncate text-slate-400">hash: <span class="text-cyan-400/80">'+e.hash.slice(0,20)+'…</span></div></div>').join('')||'<p class="text-center text-slate-500 py-6">No entries</p>'}
function drawStatic(){fences.forEach(f=>{L.polygon(f.polygon,{color:SEV[f.severity]||'#f97316',fillColor:SEV[f.severity]||'#f97316',fillOpacity:.18,weight:2,dashArray:'6 4'}).bindPopup('<b>'+f.name+'</b><br>Virtual Fence').addTo(map)});
bops.forEach(b=>{const icon=L.divIcon({className:'',html:'<div style="background:#0ea5e9;border:2px solid #e0f2fe;width:14px;height:14px;border-radius:50%"></div>',iconSize:[14,14],iconAnchor:[7,7]});L.marker([b.lat,b.lng],{icon}).bindPopup('<b>'+b.name+'</b><br>'+b.sector).addTo(map)});
cameras.forEach(c=>{const col=c.status==='online'?'#22c55e':c.status==='degraded'?'#eab308':'#64748b';L.circleMarker([c.lat,c.lng],{radius:5,color:col,fillColor:col,fillOpacity:.9}).bindPopup(c.name+' · '+c.protocol).addTo(map)})}
function refreshMarkers(){Object.keys(alertMarkers).forEach(k=>map.removeLayer(alertMarkers[k]));alertMarkers={};
alerts.filter(a=>a.status==='open').slice(0,30).forEach(a=>{const r=selectedId===a.id?12:8;const m=L.circleMarker([a.lat,a.lng],{radius:r,color:SEV[a.severity],fillColor:SEV[a.severity],fillOpacity:.7,weight:selectedId===a.id?3:1}).on('click',()=>selectAlert(a.id)).addTo(map);alertMarkers[a.id]=m})}
function selectAlert(id){selectedId=id;renderAlerts();refreshMarkers()}
async function review(id,action){await fetch(API+'/alerts/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,note:''})});await loadAll()}
async function loadAll(){const [s,a,au,b,c,f]=await Promise.all([fetch(API+'/stats').then(r=>r.json()),fetch(API+'/alerts?limit=60').then(r=>r.json()),fetch(API+'/audit?limit=40').then(r=>r.json()),fetch(API+'/bops').then(r=>r.json()),fetch(API+'/cameras').then(r=>r.json()),fetch(API+'/fences').then(r=>r.json())]);const first=!bops.length;alerts=a;bops=b;cameras=c;fences=f;renderStats(s);renderAlerts();renderAudit(au.entries,au.chain_valid);if(first)drawStatic();refreshMarkers()}
function connectWS(){const proto=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(proto+'://'+location.host+'/ws/alerts');const badge=document.getElementById('liveBadge');
ws.onopen=()=>{badge.textContent='● Live Edge Feed';badge.className='rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-1 text-xs text-emerald-300'};
ws.onclose=()=>{badge.textContent='● Reconnecting…';badge.className='rounded-full border border-slate-700 px-2.5 py-1 text-xs text-slate-400';setTimeout(connectWS,3000)};
ws.onmessage=ev=>{try{const msg=JSON.parse(ev.data);if(msg.event==='alert'&&msg.data){alerts=[msg.data,...alerts].slice(0,80);if(!selectedId)selectedId=msg.data.id;renderAlerts();refreshMarkers();fetch(API+'/stats').then(r=>r.json()).then(renderStats);fetch(API+'/audit?limit=40').then(r=>r.json()).then(au=>renderAudit(au.entries,au.chain_valid))}if(msg.event==='alert_updated')loadAll()}catch(e){}}}
document.getElementById('btnTrigger').onclick=async()=>{const btn=document.getElementById('btnTrigger');btn.disabled=true;try{await fetch(API+'/simulator/trigger',{method:'POST'});await loadAll()}finally{btn.disabled=false}};
initMap();loadAll().catch(console.error);connectWS();setInterval(()=>loadAll().catch(()=>{}),25000);
</script>
</body>
</html>
